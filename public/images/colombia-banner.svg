<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Light vignette only for text contrast — no dark bottom -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
    <!-- Subtle diagonal sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Franjas oficiales Colombia ── -->
  <!-- Amarillo: 50% del alto = 150px -->
  <rect width="800" height="150" fill="#FCD116"/>
  <!-- Azul: 25% del alto = 75px -->
  <rect y="150" width="800" height="75" fill="#003893"/>
  <!-- Rojo: 25% del alto = 75px -->
  <rect y="225" width="800" height="75" fill="#CE1126"/>

  <!-- Overlays: vignette suave + sheen, sin oscurecer el rojo -->
  <rect width="800" height="300" fill="url(#vignette)"/>
  <rect width="800" height="300" fill="url(#sheen)"/>

  <!-- Líneas divisorias entre franjas (sutil) -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#000000" stroke-width="0.5" opacity="0.15"/>

  <!-- Estrella central en zona amarilla -->
  <text x="400" y="58"
        font-family="Arial, sans-serif" font-size="30"
        text-anchor="middle"
        fill="#FFFFFF"
        opacity="0.85">★</text>

  <!-- Línea decorativa superior al título -->
  <rect x="180" y="72" width="440" height="1.5" fill="#FFFFFF" opacity="0.35" rx="1"/>

  <!-- "LA TRICOLOR" — centrado verticalmente sobre las 3 franjas -->
  <!-- Baseline y=175 centra el texto (cap-height ~50px) entre y=125 y y=175 -->
  <text x="400" y="175"
        font-family="'Arial Black', 'Impact', Arial, sans-serif"
        font-size="68" font-weight="900"
        text-anchor="middle"
        fill="#FFFFFF"
        letter-spacing="4">LA TRICOLOR</text>

  <!-- Línea decorativa inferior al título -->
  <rect x="180" y="188" width="440" height="1.5" fill="#FFFFFF" opacity="0.35" rx="1"/>

  <!-- "COLOMBIA" en zona azul -->
  <text x="400" y="215"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="700"
        text-anchor="middle"
        fill="#FFFFFF"
        opacity="0.90"
        letter-spacing="6">COLOMBIA</text>

  <!-- "FIFA WORLD CUP 2026" en zona roja -->
  <text x="400" y="262"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="400"
        text-anchor="middle"
        fill="#FFFFFF"
        opacity="0.80"
        letter-spacing="3">FIFA WORLD CUP 2026</text>

  <!-- Puntos decorativos en las esquinas -->
  <circle cx="80" cy="150" r="3" fill="#FFFFFF" opacity="0.20"/>
  <circle cx="720" cy="150" r="3" fill="#FFFFFF" opacity="0.20"/>
  <circle cx="80" cy="225" r="3" fill="#FFFFFF" opacity="0.20"/>
  <circle cx="720" cy="225" r="3" fill="#FFFFFF" opacity="0.20"/>
</svg>
