<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F2442"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Glows decorativos -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="url(#glow1)"/>
  <ellipse cx="1000" cy="200" rx="300" ry="200" fill="url(#glow2)"/>

  <!-- Líneas de campo de fútbol decorativas -->
  <g opacity="0.04" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <circle cx="600" cy="200" r="120"/>
    <circle cx="600" cy="200" r="8" fill="#38BDF8" stroke="none"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <rect x="0" y="100" width="80" height="200"/>
    <rect x="1120" y="100" width="80" height="200"/>
    <rect x="0" y="150" width="30" height="100"/>
    <rect x="1170" y="150" width="30" height="100"/>
  </g>

  <!-- Texto principal en español -->
  <text x="600" y="140" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900" font-size="88"
    fill="#F8FAFC" opacity="0.07"
    letter-spacing="8">
    COPA DEL MUNDO
  </text>

  <text x="600" y="260" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900" font-size="130"
    fill="#38BDF8" opacity="0.06"
    letter-spacing="4">
    2026
  </text>

  <!-- Estrellas decorativas -->
  <g fill="#F97316" opacity="0.3">
    <circle cx="120" cy="80"  r="2"/>
    <circle cx="340" cy="50"  r="1.5"/>
    <circle cx="880" cy="60"  r="2"/>
    <circle cx="1050" cy="90" r="1.5"/>
    <circle cx="200" cy="320" r="1.5"/>
    <circle cx="950" cy="340" r="2"/>
    <circle cx="450" cy="380" r="1"/>
    <circle cx="760" cy="30"  r="1"/>
  </g>

  <!-- Línea naranja inferior -->
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#F97316" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#F97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="397" width="1200" height="2" fill="url(#lineGrad)"/>

  <!-- Línea celeste superior sutil -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#lineGrad)" opacity="0.4"/>
</svg>
